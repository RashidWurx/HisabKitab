name: iOS build

# Builds the iPhone app on a GitHub Mac. Runs on every push to main and can be
# started by hand (Actions tab > "iOS build" > Run workflow).
# The result is an UNSIGNED .ipa, attached to the run as "Hisaab-ios-unsigned".
# Sign it while installing with Sideloadly or AltStore (a free Apple ID works).

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test --no-pub

      - name: Build iOS (no code signing)
        run: flutter build ios --release --no-codesign --no-pub

      - name: Package unsigned .ipa
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry Hisaab-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Hisaab-ios-unsigned
          path: Hisaab-unsigned.ipa
          retention-days: 14
